[package]
name = "colibri"
version = "0.6.0"
description = "Distributed rate-limiting as a service"
authors = ["Erik Aker <eraker@gmail.com>"]
homepage = "https://github.com/erewok/colibri"
repository = "https://github.com/erewok/colibri"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"

default-run = "colibri-server"

[[bin]]
name = "colibri-server"
path = "src/main.rs"

[[bin]]
name = "colibri-admin"
path = "src/bin/colibri-admin.rs"

[[bench]]
name = "rate_limiter_benchmarks"
harness = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
crdts = "7.3.2"
figment = { version = "0.10.19", features = ["toml"] }
gxhash = "3.5"
hostname = "0.4.2"
indexmap = {version = "2.14.0", features = ["serde"] }
num-bigint = "0.4.8"
num-traits = "0.2.19"
papaya = { version = "0.2.5", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
] }
toml = "1.1.4"
tower = { version = "0.5.3", features = [
    "util",
    "timeout",
    "load-shed",
    "limit",
] }
tower-http = { version = "0.7.0", features = [
    "add-extension",
    "auth",
    "compression-full",
    "limit",
    "trace",
] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
thiserror = "2.0.20"
url = "2.5.8"
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
# console-subscriber = "0.5.0"
criterion = "0.8.2"
env_logger = "0.11.11"
mock_instant = "0.6.1"
proptest = "1.11.0"
tempfile = "3.27.0"
tokio-test = "0.4.5"
