[package]
name = "colibri"
version = "0.7.0"
description = "Distributed rate-limiting as a service"
authors = ["Erik Aker <eraker@gmail.com>"]
repository = "https://github.com/erewok/colibri"
edition = "2024"
rust-version = "1.86"
license = "MPL-2.0"

default-run = "colibri-server"

[[bin]]
name = "colibri-server"
path = "src/main.rs"

[[bin]]
name = "colibri-admin"
path = "src/bin/colibri-admin.rs"

[[bench]]
name = "rate_limiter_benchmarks"
harness = false

[features]
# Lets a thread replace the limiters' clocks with a controllable virtual clock.
# Enabled for this crate's own tests via the self dev-dependency below.
test-clock = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crdts = "7.3.2"
figment = { version = "0.10.19", features = ["toml"] }
gxhash = "3.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
num-bigint = "0.4.8"
num-traits = "0.2.19"
papaya = { version = "0.2.5", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
    "signal",
] }
toml = "1.1.8"
tower = { version = "0.5.3", features = [
    "util",
    "timeout",
    "load-shed",
    "limit",
] }
tower-http = { version = "0.7.1", features = [
    "add-extension",
    "auth",
    "compression-full",
    "limit",
    "trace",
] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
thiserror = "2.0.21"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
colibri = { path = ".", features = ["test-clock"] }
# console-subscriber = "0.5.0"
criterion = "0.8.2"
env_logger = "0.11.11"
hegeltest = "0.49.2"
mock_instant = "0.6.1"
proptest = "1.11.0"
tempfile = "3.27.0"
tokio-test = "0.4.6"
