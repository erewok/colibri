\* TLC configuration for Gossip.tla with three nodes.
\*
\* Model parameters:
\*   3 nodes, MaxTokens=2, AgeingWindow=1, MaxOps=7, MaxTicks=3
\*
\* Three nodes add relayed state (n1 -> n2 -> n3) and merges of two partial
\* views, which two nodes cannot produce. MaxOps exceeds 3 * MaxTokens - 1 so
\* that ClusterLiveWithinBound can be reached at its limit; with fewer ops it
\* would hold vacuously.
\*
\* SYMMETRY NodePerms explores one representative per permutation of Nodes.
\* Checked on 2026-10-10: 29,184,459 distinct states, about 3 minutes with
\* 12 workers.
\*
\* Run: java -cp tla2tools.jar tlc2.TLC -workers auto -config Gossip3.cfg Gossip.tla

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTokens = 2
    AgeingWindow = 1
    MaxOps = 7
    MaxTicks = 3
    MaxRestarts = 1

SPECIFICATION Spec

\* The model is bounded (MaxOps, MaxTicks, MaxRestarts), so it can reach
\* states where every bound is used up and nothing is enabled. Those are not
\* deadlocks of the system, only the end of the explored behaviors.
CHECK_DEADLOCK FALSE
SYMMETRY NodePerms

INVARIANT TypeOK
INVARIANT NoPrematureRelease
INVARIANT WriterHighWater
INVARIANT WriterNotBehind
INVARIANT OwnLiveTracked
INVARIANT RetirementDeadline
INVARIANT ExpiriesWithinRequests
INVARIANT TokensWithinCapacity
INVARIANT NodeLiveWithinCapacity
INVARIANT ClusterLiveWithinBound
INVARIANT ConvergenceQuiescent
