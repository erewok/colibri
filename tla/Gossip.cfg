\* TLC configuration for Gossip.tla
\*
\* Model parameters (kept small for tractable state space):
\*   2 nodes, MaxTokens=2, AgeingWindow=1, MaxOps=5, MaxTicks=3
\*
\* MaxOps exceeds MaxTokens so that both nodes can admit concurrently and
\* overshoot a single node's capacity, and so that requests can be admitted
\* again after earlier ones age out.
\*
\* SPECIFICATION uses Spec (safety-only, no WF fairness) so that TLC explores
\* all reachable states without the obligation-set multiplication that caused
\* OOM under WF_vars(GossipMerge).
\*
\* The Convergence liveness property (<>[] AllNodesAgree under WF fairness)
\* is replaced by the safety invariant ConvergenceQuiescent:
\*   GossipQuiescent => AllNodesAgree
\* This is checked as an INVARIANT, not a PROPERTY, so no fairness path
\* enumeration occurs.  See spec comments for the proof sketch.

CONSTANTS
    Nodes = {n1, n2}
    MaxTokens = 2
    AgeingWindow = 1
    MaxOps = 5
    MaxTicks = 3
    MaxRestarts = 1

SPECIFICATION Spec

\* The model is bounded (MaxOps, MaxTicks, MaxRestarts), so it can reach
\* states where every bound is used up and nothing is enabled. Those are not
\* deadlocks of the system, only the end of the explored behaviors.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT NoPrematureRelease
INVARIANT SeenRequestsCounted
INVARIANT WriterHighWater
INVARIANT WriterNotBehind
INVARIANT OwnLiveTracked
INVARIANT RetirementDeadline
INVARIANT ExpiriesWithinRequests
INVARIANT TokensWithinCapacity
INVARIANT NodeLiveWithinCapacity
INVARIANT ClusterLiveWithinBound
INVARIANT ConvergenceQuiescent
